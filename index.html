<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공구 캘린더</title>
<meta name="description" content="공동구매 일정을 한눈에. 내 캘린더로 내보내고 시작 30분 전 알람까지.">
<meta name="color-scheme" content="light dark">
<style>
:root {
  --bg: #ffffff; --bg-sub: #f6f7f9; --card: #ffffff;
  --line: #e4e6eb; --line-soft: #eef0f4;
  --text: #16181d; --text-2: #5c6270; --text-3: #9aa0ad;
  --accent: #4f7cff; --danger: #e5484d;
  --radius: 14px; --sheet-radius: 20px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --topbar-h: 104px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1115; --bg-sub: #171a20; --card: #171a20;
    --line: #282c35; --line-soft: #22252d;
    --text: #f0f2f6; --text-2: #a2a9b8; --text-3: #737b8b;
    --accent: #6f95ff;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
    "Segoe UI", "Noto Sans KR", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30; background: var(--bg);
  border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px);
}
@supports (backdrop-filter: blur(1px)) {
  .topbar { background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: saturate(180%) blur(14px); }
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px; }
.bar.sub { padding-top: 0; padding-bottom: 10px; }
.nav { display: flex; align-items: center; gap: 2px; min-width: 0; }
.nav h1 { font-size: 17px; font-weight: 700; margin: 0 6px; letter-spacing: -.2px; white-space: nowrap; }
.bar-actions { display: flex; align-items: center; gap: 4px; }

.icon-btn {
  display: grid; place-items: center; width: 34px; height: 34px; flex: none;
  border: 0; border-radius: 10px; background: transparent; color: var(--text-2); cursor: pointer;
}
.icon-btn:active { background: var(--bg-sub); }
.icon-btn.spin svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }

.btn {
  appearance: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
  font: inherit; font-weight: 600; padding: 11px 14px; border-radius: 12px;
  cursor: pointer; text-align: center; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.sm { padding: 8px 10px; font-size: 13px; }

.segmented { display: flex; gap: 2px; padding: 2px; background: var(--bg-sub); border-radius: 10px; }
.seg {
  border: 0; background: transparent; color: var(--text-2);
  font: inherit; font-weight: 600; font-size: 13px;
  padding: 6px 16px; border-radius: 8px; cursor: pointer;
}
.seg.is-active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

.filters { display: flex; gap: 6px; min-width: 0; }
.select {
  appearance: none; font: inherit; font-size: 13px; font-weight: 600;
  color: var(--text-2); background: var(--bg-sub);
  border: 0; border-radius: 10px; padding: 7px 10px; max-width: 30vw;
  text-overflow: ellipsis; cursor: pointer;
}
.select.on { color: var(--accent); background: rgba(79,124,255,.14); }

/* ---------- layout ---------- */
.view { padding: 12px 12px 40px; min-height: 60vh; }
.footer {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 12px 16px calc(20px + var(--safe-b));
  color: var(--text-3); font-size: 12px; border-top: 1px solid var(--line-soft);
}
.empty { text-align: center; color: var(--text-3); padding: 56px 20px; font-size: 14px; line-height: 1.7; }

/* ---------- month grid ---------- */
.dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; }
.dow span { text-align: center; font-size: 11px; font-weight: 700; color: var(--text-3); padding: 4px 0; }
.dow span.sun { color: #e5484d; }
.dow span.sat { color: #4f7cff; }

.month { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.cell {
  min-height: 84px; padding: 4px 3px; border-radius: 10px; background: var(--bg-sub);
  display: flex; flex-direction: column; gap: 2px;
  border: 1.5px solid transparent; cursor: pointer; overflow: hidden;
}
.cell.out { opacity: .4; }
.cell.today { border-color: var(--accent); }
.cell .d { font-size: 12px; font-weight: 700; color: var(--text-2); padding: 1px 4px; }
.cell.today .d { color: var(--accent); }
.cell .d.sun { color: #e5484d; }
.cell .d.sat { color: #4f7cff; }

.chip {
  display: flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600; line-height: 1.35;
  padding: 2px 4px; border-radius: 5px;
  background: var(--bar-bg, rgba(79,124,255,.14)); color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-left: 4px solid var(--bar-line, var(--accent)); cursor: pointer;
}
.chip.mid { border-left-color: transparent; padding-left: 6px; }
.chip .lbl { overflow: hidden; text-overflow: ellipsis; }
.more { font-size: 10px; font-weight: 700; color: var(--text-3); padding-left: 5px; }

/* ---------- week / day list ---------- */
.daygroup { margin-bottom: 8px; }
.daygroup h2 {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 13px; font-weight: 700; color: var(--text-2);
  margin: 0; padding: 12px 4px 8px;
  position: sticky; top: var(--topbar-h); background: var(--bg); z-index: 5;
  border-bottom: 1px solid var(--line-soft);
}
.daygroup h2 .num { font-size: 20px; font-weight: 800; color: var(--text); letter-spacing: -.5px; }
.daygroup.is-today h2 .num, .daygroup.is-today h2 { color: var(--accent); }
.daygroup .none { color: var(--text-3); font-size: 13px; padding: 10px 6px 14px; }

.evlist { list-style: none; margin: 0; padding: 8px 0 6px; display: flex; flex-direction: column; gap: 8px; }
.ev {
  display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line);
  border-left: 4px solid var(--bar-line, var(--accent));
  border-radius: var(--radius); padding: 12px; cursor: pointer; font: inherit; color: inherit;
}
.ev:active { background: var(--bg-sub); }
.ev-main { min-width: 0; flex: 1; }
/* 파스텔은 글자색으로 쓰면 안 읽혀서, 색은 왼쪽 띠·칩·점으로만 표현 */
.ev-brand { font-size: 11.5px; font-weight: 700; color: var(--text-2); margin: 0 0 1px; }
.ev-brand .cat { color: var(--text-3); font-weight: 600; }
.ev-brand .cat::before { content: '· '; }
.ev-title { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -.2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-meta { font-size: 12px; color: var(--text-2); margin: 3px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ev-price { font-weight: 700; color: var(--text); }
.strike { color: var(--text-3); text-decoration: line-through; font-weight: 400; }

.badge { font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 20px; letter-spacing: .1px; }
.badge.live { background: rgba(48,164,108,.16); color: #2b9a66; }
.badge.soon { background: rgba(79,124,255,.16); color: var(--accent); }
.badge.done { background: var(--bg-sub); color: var(--text-3); }
.badge.last { background: rgba(229,72,77,.16); color: var(--danger); }

.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--accent); }
.dot.lg { width: 12px; height: 12px; margin-top: 6px; }

/* ---------- bottom sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 40; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0 } }

.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg);
  border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
  box-shadow: 0 -8px 40px rgba(0,0,0,.28);
  padding-bottom: calc(14px + var(--safe-b));
  max-height: 84vh; overflow-y: auto;
  animation: rise .26s cubic-bezier(.2,.8,.2,1);
}
@media (min-width: 640px) {
  .sheet { left: 50%; right: auto; transform: translateX(-50%); width: 460px; border-radius: var(--sheet-radius); bottom: 20px; }
}
@keyframes rise { from { transform: translateY(100%) } }
@media (min-width: 640px) { @keyframes rise { from { transform: translate(-50%, 110%) } } }

.sheet-grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 0; }
.sheet-body { padding: 12px 18px 4px; }
.sheet-head { display: flex; gap: 10px; align-items: flex-start; }
.sheet-heads { flex: 1; min-width: 0; }
.sheet-brand { font-size: 12px; font-weight: 700; color: var(--text-2); margin: 4px 0 2px; }
.sheet-title { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -.4px; line-height: 1.3; }

.facts { margin: 16px 0 0; display: grid; grid-template-columns: 74px 1fr; gap: 9px 12px; font-size: 14px; }
.facts dt { color: var(--text-3); font-size: 13px; }
.facts dd { margin: 0; font-weight: 600; }
.muted { color: var(--text-3); font-weight: 500; }
.note {
  margin: 16px 0 0; padding: 11px 13px; border-radius: 10px;
  background: var(--bg-sub); color: var(--text-2); font-size: 13.5px; white-space: pre-wrap;
}
.sheet-actions { display: flex; flex-direction: column; gap: 8px; padding: 18px 18px 0; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(28px + var(--safe-b)); z-index: 80;
  background: #16181d; color: #fff; padding: 11px 18px; border-radius: 24px;
  font-size: 13.5px; font-weight: 600; max-width: 88vw; text-align: center;
  box-shadow: 0 6px 24px rgba(0,0,0,.3); animation: rise .2s ease;
}
@media (prefers-color-scheme: dark) { .toast { background: #f0f2f6; color: #16181d; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="bar">
    <div class="nav">
      <button id="btn-prev" class="icon-btn" aria-label="이전 기간">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="period-label">—</h1>
      <button id="btn-next" class="icon-btn" aria-label="다음 기간">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
    <div class="bar-actions">
      <button id="btn-reload" class="icon-btn" aria-label="새로 불러오기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 11-3.5-7.1"/><path d="M21 4v5h-5"/></svg>
      </button>
      <button id="btn-today" class="btn ghost">오늘</button>
    </div>
  </div>
  <div class="bar sub">
    <div class="segmented" role="tablist" aria-label="보기 전환">
      <button class="seg is-active" data-view="month" role="tab">월</button>
      <button class="seg" data-view="week" role="tab">주</button>
      <button class="seg" data-view="day" role="tab">일</button>
    </div>
    <div class="filters">
      <select id="cat-filter" class="select" aria-label="카테고리 필터">
        <option value="">전체 카테고리</option>
        <option value="육아">육아</option>
        <option value="음식">음식</option>
        <option value="생활용품">생활용품</option>
        <option value="여행">여행</option>
      </select>
      <select id="brand-filter" class="select" aria-label="브랜드 필터">
        <option value="">전체 브랜드</option>
      </select>
    </div>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<footer class="footer"><span id="meta-info"></span></footer>

<!-- 상세 바텀시트 -->
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <span id="sheet-dot" class="dot lg"></span>
      <div class="sheet-heads">
        <p id="sheet-brand" class="sheet-brand"></p>
        <h2 id="sheet-title" class="sheet-title"></h2>
      </div>
      <button id="sheet-close" class="icon-btn" aria-label="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <dl id="sheet-facts" class="facts"></dl>
    <p id="sheet-note" class="note" hidden></p>
  </div>
  <div class="sheet-actions">
    <a id="sheet-link" class="btn primary" target="_blank" rel="noopener" hidden>구매 링크 열기</a>
    <button id="sheet-export" class="btn">내 캘린더로 내보내기 · 30분 전 알람</button>
    <a id="sheet-gcal" class="btn ghost sm" target="_blank" rel="noopener">Google 캘린더에서 열기</a>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script>
(function () {
  'use strict';

  // ============================================================
  //  읽어올 위치 — 코드에 고정. 화면에서는 바꿀 수 없습니다.
  //  일정 등록·수정은 일정관리.html 에서 합니다.
  // ============================================================
  var SRC = {
    owner: 'Woonis',
    repo: 'gonggoo',
    branch: 'main',
    path: 'data/schedules.json',
  };

  var SRC_URL = 'https://raw.githubusercontent.com/' +
    SRC.owner + '/' + SRC.repo + '/' + SRC.branch + '/' + SRC.path;

  var CATEGORIES = ['육아', '음식', '생활용품', '여행'];

  // 옛 12색 파스텔로 저장된 일정은 새 8색 팔레트의 같은 자리 색으로 바꿔서 보여줍니다.
  // (파일을 다시 올리지 않아도 화면에서 바로 구별됩니다 — 저장된 값은 건드리지 않습니다.)
  var LEGACY_COLORS = {
    '#ffaaa6': '#2a78d6', '#ffd3b5': '#eb6834', '#fce38a': '#1baf7a', '#dcedc1': '#eda100',
    '#a8e6ce': '#e87ba4', '#95e1d3': '#008300', '#a8d8ea': '#4a3aa7', '#8ec5fc': '#e34948',
    '#aa96da': '#2a78d6', '#c8a2e0': '#eb6834', '#fcbad3': '#1baf7a', '#f38181': '#eda100',
  };

  // 다크 모드에서는 같은 8색을 어두운 배경용으로 한 단계 조정해 씁니다.
  var DARK_STEP = {
    '#2a78d6': '#3987e5', '#eb6834': '#d95926', '#1baf7a': '#199e70', '#eda100': '#c98500',
    '#e87ba4': '#d55181', '#008300': '#008300', '#4a3aa7': '#9085e9', '#e34948': '#e66767',
  };

  var isDark = function () {
    try { return window.matchMedia('(prefers-color-scheme: dark)').matches; }
    catch (e) { return false; }
  };

  /** 저장된 색 → 실제로 칠할 색 (옛 색 치환 + 다크 모드 보정) */
  function chipColor(raw) {
    var c = String(raw || '').toLowerCase();
    c = LEGACY_COLORS[c] || c;
    return (isDark() && DARK_STEP[c]) || c;
  }

  var CACHE_KEY = 'gonggoo.view.cache.v1';
  var MAX_CHIPS = 3;
  var ALARM_MIN = 30;

  var $ = function (id) { return document.getElementById(id); };

  var LS = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  // ---------- 날짜/포맷 ----------
  var pad = function (n) { return String(n).padStart(2, '0'); };
  var ymd = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  function parseLocal(dateStr, timeStr) {
    var a = String(dateStr).split('-').map(Number);
    var b = String(timeStr || '00:00').split(':').map(Number);
    return new Date(a[0], a[1] - 1, a[2], b[0] || 0, b[1] || 0, 0, 0);
  }

  var startOfDay = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  function addDays(d, n) { var x = startOfDay(d); x.setDate(x.getDate() + n); return x; }
  var startOfWeek = function (d) { return addDays(d, -startOfDay(d).getDay()); };
  var startOfMonth = function (d) { return new Date(d.getFullYear(), d.getMonth(), 1); };
  var endOfMonth = function (d) { return new Date(d.getFullYear(), d.getMonth() + 1, 0); };
  var isSameDay = function (a, b) { return ymd(a) === ymd(b); };
  function diffDays(a, b) { return Math.round((startOfDay(b) - startOfDay(a)) / 86400000); }

  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  var fmtMonth = function (d) { return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월'; };
  var fmtDay = function (d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'; };

  function fmtWeekRange(start) {
    var end = addDays(start, 6);
    var tail = start.getMonth() === end.getMonth()
      ? end.getDate() + '일'
      : (end.getMonth() + 1) + '월 ' + end.getDate() + '일';
    return (start.getMonth() + 1) + '월 ' + start.getDate() + '일 – ' + tail;
  }

  var fmtTime = function (d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
  var fmtPrice = function (n) {
    return Number.isFinite(Number(n)) && n !== '' && n !== null
      ? Number(n).toLocaleString('ko-KR') + '원' : '';
  };

  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; });
  }

  function rgbParts(hex) {
    var h = String(hex || '').replace('#', '');
    var full = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
    var n = parseInt(full, 16);
    if (!/^[0-9a-f]{6}$/i.test(full) || Number.isNaN(n)) return '79, 124, 255';
    return ((n >> 16) & 255) + ', ' + ((n >> 8) & 255) + ', ' + (n & 255);
  }

  function safeUrl(url) {
    if (!url) return '';
    try {
      var u = new URL(String(url).trim());
      return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
    } catch (e) { return ''; }
  }

  // ---------- 정규화 ----------
  var seq = 0;
  function normalize(raw) {
    if (!raw || !raw.startDate) return null;
    var startDate = String(raw.startDate).slice(0, 10);
    var endDate = String(raw.endDate || startDate).slice(0, 10);
    var startTime = /^\d{2}:\d{2}$/.test(raw.startTime || '') ? raw.startTime : '00:00';
    var endTime = /^\d{2}:\d{2}$/.test(raw.endTime || '') ? raw.endTime : '23:59';
    var start = parseLocal(startDate, startTime);
    var end = parseLocal(endDate, endTime);
    if (Number.isNaN(+start) || Number.isNaN(+end)) return null;

    return {
      id: raw.id || 's' + Date.now().toString(36) + (seq++).toString(36),
      brand: String(raw.brand || '').trim() || '공구',
      product: String(raw.product || raw.title || '').trim() || '(제목 없음)',
      category: CATEGORIES.indexOf(raw.category) >= 0 ? raw.category : '',
      startDate: startDate,
      endDate: endDate >= startDate ? endDate : startDate,
      startTime: startTime, endTime: endTime,
      start: start, end: end >= start ? end : start,
      link: safeUrl(raw.link),
      price: (raw.price === '' || raw.price == null) ? null : Number(raw.price),
      originalPrice: (raw.originalPrice === '' || raw.originalPrice == null) ? null : Number(raw.originalPrice),
      note: String(raw.note || '').trim(),
      color: /^#[0-9a-f]{6}$/i.test(raw.color || '') ? raw.color : '#4f7cff',
    };
  }

  function parseList(json) {
    var arr = Array.isArray(json) ? json : (json && json.schedules);
    return (Array.isArray(arr) ? arr : []).map(normalize).filter(Boolean);
  }

  // ---------- 읽기 (공개 레포 raw 전용 · 토큰 없음) ----------
  async function loadSchedules() {
    var error = '';
    try {
      var res = await fetch(SRC_URL + '?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) {
        var json = await res.json();
        LS.set(CACHE_KEY, JSON.stringify(json));
        return { schedules: parseList(json), source: 'github' };
      }
      error = res.status === 404 ? '일정 파일을 찾을 수 없습니다' : 'HTTP ' + res.status;
    } catch (e) { error = '네트워크 오류'; }

    // 오프라인이면 마지막으로 받아둔 내용 재사용
    try {
      var cached = JSON.parse(LS.get(CACHE_KEY) || 'null');
      if (cached) return { schedules: parseList(cached), source: 'cache', error: error };
    } catch (e) { /* 캐시 없음 */ }

    return { schedules: [], source: 'none', error: error };
  }

  // ---------- ICS ----------
  var utcStamp = function (d) {
    return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) +
      'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  };

  var esc = function (s) {
    return String(s == null ? '' : s)
      .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  };

  /** RFC 5545: 한 줄 75옥텟 — UTF-8 바이트 기준으로 접기 */
  function fold(line) {
    var bytes = new TextEncoder().encode(line);
    if (bytes.length <= 74) return line;
    var dec = new TextDecoder();
    var out = [], start = 0, limit = 74;
    while (start < bytes.length) {
      var end = Math.min(start + limit, bytes.length);
      while (end > start && end < bytes.length && (bytes[end] & 0xc0) === 0x80) end--;
      out.push((start ? ' ' : '') + dec.decode(bytes.slice(start, end)));
      start = end;
      limit = 73;
    }
    return out.join('\r\n');
  }

  function buildIcs(list) {
    var stamp = utcStamp(new Date());
    var body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//gonggoo-calendar//KO//',
      'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:공구 일정'];

    list.forEach(function (s) {
      var desc = [
        s.brand + ' 공동구매',
        s.price != null ? '공구가 ' + Number(s.price).toLocaleString('ko-KR') + '원' : '',
        s.originalPrice != null ? '정가 ' + Number(s.originalPrice).toLocaleString('ko-KR') + '원' : '',
        s.note, s.link,
      ].filter(Boolean).join('\n');

      body = body.concat([
        'BEGIN:VEVENT',
        'UID:' + s.id + '@gonggoo.local',
        'DTSTAMP:' + stamp,
        'DTSTART:' + utcStamp(s.start),
        'DTEND:' + utcStamp(s.end),
        'SUMMARY:[공구] ' + esc(s.brand) + ' · ' + esc(s.product),
        'DESCRIPTION:' + esc(desc),
        s.link ? 'URL:' + esc(s.link) : '',
        // 다중 값은 쉼표로 구분 — 각 값만 이스케이프해야 구분자가 안 깨짐
        'CATEGORIES:' + ['공동구매', s.category].filter(Boolean).map(esc).join(','),
        'BEGIN:VALARM',
        'TRIGGER:-PT' + ALARM_MIN + 'M',
        'ACTION:DISPLAY',
        'DESCRIPTION:' + esc(s.brand + ' ' + s.product + ' 공구 ' + ALARM_MIN + '분 후 시작'),
        'END:VALARM',
        'END:VEVENT',
      ].filter(Boolean));
    });

    body.push('END:VCALENDAR');
    return body.map(fold).join('\r\n') + '\r\n';
  }

  var slug = function (s) {
    return String(s).replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '').slice(0, 40) || 'gonggoo';
  };

  function downloadIcs(item) {
    var blob = new Blob([buildIcs([item])], { type: 'text/calendar;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = slug(item.brand + '-' + item.product) + '.ics';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function googleCalendarUrl(s) {
    var p = new URLSearchParams({
      action: 'TEMPLATE',
      text: '[공구] ' + s.brand + ' · ' + s.product,
      dates: utcStamp(s.start) + '/' + utcStamp(s.end),
      details: [s.note, s.link].filter(Boolean).join('\n'),
    });
    return 'https://calendar.google.com/calendar/render?' + p;
  }

  // ---------- 상태 ----------
  var state = { view: 'month', cursor: new Date(), schedules: [], brand: '', cat: '', source: 'none' };

  var coversDay = function (s, day) {
    var key = ymd(day);
    return key >= s.startDate && key <= s.endDate;
  };
  var onDay = function (list, day) {
    return list.filter(function (s) { return coversDay(s, day); });
  };

  function statusOf(s, now) {
    now = now || new Date();
    if (now < s.start) {
      var d = diffDays(now, s.start);
      if (d === 0) return { key: 'soon', label: '오늘 오픈' };
      if (d === 1) return { key: 'soon', label: '내일 오픈' };
      return { key: 'soon', label: 'D-' + d };
    }
    if (now > s.end) return { key: 'done', label: '마감' };
    var left = diffDays(now, s.end);
    if (left === 0) return { key: 'last', label: '오늘 마감' };
    if (left === 1) return { key: 'last', label: '내일 마감' };
    return { key: 'live', label: '진행중' };
  }

  // 색은 왼쪽 테두리에 진하게(원색) 싣고, 배경은 옅게 깔아 글자 가독성을 지킵니다.
  // 알파를 올리면 색끼리는 잘 구별되지만 글자가 묻히므로, 구별은 테두리가 맡습니다.
  var styleVars = function (s) {
    var c = chipColor(s.color);
    return '--bar-line:' + c + ';--bar-bg:rgba(' + rgbParts(c) + ',.16)';
  };

  function priceHtml(s) {
    var now = fmtPrice(s.price), was = fmtPrice(s.originalPrice);
    if (!now && !was) return '';
    var off = (s.price != null && s.originalPrice > s.price)
      ? ' <span class="ev-price">' + Math.round((1 - s.price / s.originalPrice) * 100) + '%</span>' : '';
    return '<span>' + (was && now ? '<span class="strike">' + was + '</span> ' : '') +
      '<span class="ev-price">' + (now || was) + '</span>' + off + '</span>';
  }

  function spanInfo(s, day) {
    var total = diffDays(s.start, s.end) + 1;
    if (total <= 1) return '';
    return '<span>' + total + '일 중 ' + (diffDays(s.start, day) + 1) + '일차</span>';
  }

  function eventItem(s, day) {
    var st = statusOf(s);
    var time = s.startDate === ymd(day) ? fmtTime(s.start) + ' 오픈'
      : s.endDate === ymd(day) ? fmtTime(s.end) + ' 마감' : '';
    return '<li><button class="ev" data-id="' + s.id + '" style="' + styleVars(s) + '">' +
      '<div class="ev-main">' +
        '<p class="ev-brand">' + escapeHtml(s.brand) +
          (s.category ? ' <span class="cat">' + escapeHtml(s.category) + '</span>' : '') + '</p>' +
        '<p class="ev-title">' + escapeHtml(s.product) + '</p>' +
        '<p class="ev-meta">' +
          '<span class="badge ' + st.key + '">' + st.label + '</span>' +
          (time ? '<span>' + time + '</span>' : '') +
          spanInfo(s, day) + priceHtml(s) +
        '</p>' +
      '</div>' +
      '<svg viewBox="0 0 24 24" aria-hidden="true" style="color:var(--text-3)"><path d="M9 5l7 7-7 7"/></svg>' +
      '</button></li>';
  }

  function renderMonth(el, cursor, list) {
    var first = startOfMonth(cursor);
    var gridStart = startOfWeek(first);
    var weeks = Math.ceil((first.getDay() + endOfMonth(cursor).getDate()) / 7);
    var today = new Date();

    var dow = DOW.map(function (d, i) {
      return '<span class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + d + '</span>';
    }).join('');

    var cells = '';
    for (var i = 0; i < weeks * 7; i++) {
      var day = addDays(gridStart, i);
      var key = ymd(day);
      var items = onDay(list, day);
      var cls = ['cell',
        day.getMonth() === cursor.getMonth() ? '' : 'out',
        isSameDay(day, today) ? 'today' : ''].filter(Boolean).join(' ');

      var chips = items.slice(0, MAX_CHIPS).map(function (s) {
        var mid = s.startDate !== key ? ' mid' : '';
        // 칩이 좁으니 브랜드명만 — 어느 날짜에서든 같은 라벨이라 같은 공구임이 바로 보입니다.
        // 상품명은 칩을 눌러 뜨는 상세, 그리고 주/일 보기에서 확인합니다.
        return '<span class="chip' + mid + '" data-id="' + s.id + '" style="' + styleVars(s) + '"' +
          ' title="' + escapeHtml(s.brand + ' ' + s.product) + '">' +
          '<span class="lbl">' + escapeHtml(s.brand) + '</span></span>';
      }).join('');

      var more = items.length > MAX_CHIPS ? '<span class="more">+' + (items.length - MAX_CHIPS) + '</span>' : '';
      var dcls = i % 7 === 0 ? ' sun' : i % 7 === 6 ? ' sat' : '';

      cells += '<div class="' + cls + '" data-date="' + key + '" role="button" tabindex="0">' +
        '<span class="d' + dcls + '">' + day.getDate() + '</span>' + chips + more + '</div>';
    }

    el.innerHTML = '<div class="dow">' + dow + '</div><div class="month">' + cells + '</div>';
  }

  function dayGroup(day, list, showEmpty) {
    var items = onDay(list, day);
    if (!items.length && !showEmpty) return '';
    var isToday = isSameDay(day, new Date());
    return '<section class="daygroup' + (isToday ? ' is-today' : '') + '">' +
      '<h2><span class="num">' + day.getDate() + '</span> ' +
      fmtDay(day).replace(/^\d+월 \d+일 /, '') + (isToday ? ' · 오늘' : '') + '</h2>' +
      (items.length
        ? '<ul class="evlist">' + items.map(function (s) { return eventItem(s, day); }).join('') + '</ul>'
        : '<p class="none">등록된 공구가 없어요.</p>') +
      '</section>';
  }

  function renderWeek(el, cursor, list) {
    var start = startOfWeek(cursor);
    var html = '';
    for (var i = 0; i < 7; i++) html += dayGroup(addDays(start, i), list, false);
    el.innerHTML = html || '<p class="empty">이번 주에는 등록된 공구가 없어요.</p>';
  }

  // ---------- 토스트 ----------
  var toastTimer;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }

  // ---------- 화면 갱신 ----------
  var visible = function () {
    return state.schedules.filter(function (s) {
      return (!state.brand || s.brand === state.brand) &&
        (!state.cat || s.category === state.cat);
    });
  };

  function periodLabel() {
    if (state.view === 'month') return fmtMonth(state.cursor);
    if (state.view === 'week') return fmtWeekRange(startOfWeek(state.cursor));
    return fmtDay(state.cursor);
  }

  function render() {
    $('period-label').textContent = periodLabel();
    Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (b) {
      b.classList.toggle('is-active', b.dataset.view === state.view);
    });

    var el = $('view');
    if (!state.schedules.length) {
      el.innerHTML = '<p class="empty">' + (state.source === 'none'
        ? '일정을 불러올 수 없습니다.<br>네트워크를 확인한 뒤 ↻ 를 눌러 주세요.'
        : '아직 등록된 공구가 없어요.') + '</p>';
      return;
    }

    var list = visible();
    if (!list.length) {
      el.innerHTML = '<p class="empty">조건에 맞는 공구가 없어요.<br>필터를 바꿔 보세요.</p>';
      return;
    }

    if (state.view === 'month') renderMonth(el, state.cursor, list);
    else if (state.view === 'week') renderWeek(el, state.cursor, list);
    else el.innerHTML = dayGroup(state.cursor, list, true);
  }

  function renderFilters() {
    var cat = $('cat-filter');
    if (CATEGORIES.indexOf(state.cat) < 0) state.cat = '';
    cat.value = state.cat;
    cat.classList.toggle('on', Boolean(state.cat));

    // 브랜드 목록은 고른 카테고리 안에서만 보여줌
    var brands = [];
    state.schedules.forEach(function (s) {
      if (state.cat && s.category !== state.cat) return;
      if (brands.indexOf(s.brand) < 0) brands.push(s.brand);
    });
    brands.sort(function (a, b) { return a.localeCompare(b, 'ko'); });

    var sel = $('brand-filter');
    sel.innerHTML = '<option value="">전체 브랜드</option>' + brands.map(function (b) {
      return '<option value="' + escapeHtml(b) + '">' + escapeHtml(b) + '</option>';
    }).join('');
    if (brands.indexOf(state.brand) < 0) state.brand = '';
    sel.value = state.brand;
    sel.classList.toggle('on', Boolean(state.brand));
  }

  function updateMeta() {
    var label = { github: '최신', cache: '오프라인 캐시', none: '불러오기 실패' }[state.source] || state.source;
    $('meta-info').textContent = '공구 ' + state.schedules.length + '건 · ' + label;
  }

  // ---------- 바텀시트 ----------
  var sheetItem = null;

  function openSheet(id) {
    var s = null;
    state.schedules.forEach(function (x) { if (x.id === id) s = x; });
    if (!s) return;
    sheetItem = s;

    var st = statusOf(s);
    var span = diffDays(s.start, s.end) + 1;
    var period = s.startDate === s.endDate
      ? fmtDay(s.start) + ' ' + fmtTime(s.start) + ' – ' + fmtTime(s.end)
      : fmtDay(s.start) + ' ' + fmtTime(s.start) + '<br>→ ' + fmtDay(s.end) + ' ' + fmtTime(s.end);

    $('sheet-dot').style.background = chipColor(s.color);
    $('sheet-brand').textContent = s.brand + (s.category ? ' · ' + s.category : '');
    $('sheet-title').textContent = s.product;

    var now = fmtPrice(s.price), was = fmtPrice(s.originalPrice);
    var priceRow = '';
    if (now || was) {
      var off = (s.price != null && s.originalPrice > s.price)
        ? ' <span style="color:var(--danger);font-weight:700">' +
          Math.round((1 - s.price / s.originalPrice) * 100) + '% 할인</span>' : '';
      priceRow = '<dt>가격</dt><dd>' + (now || was) +
        (was && now ? ' <span class="strike">' + was + '</span>' : '') + off + '</dd>';
    }

    $('sheet-facts').innerHTML =
      '<dt>상태</dt><dd><span class="badge ' + st.key + '">' + st.label + '</span>' +
      (span > 1 ? ' <span class="muted">총 ' + span + '일</span>' : '') + '</dd>' +
      '<dt>기간</dt><dd>' + period + '</dd>' + priceRow;

    var note = $('sheet-note');
    note.textContent = s.note;
    note.hidden = !s.note;

    var link = $('sheet-link');
    link.hidden = !s.link;
    if (s.link) link.href = s.link;

    $('sheet-gcal').href = googleCalendarUrl(s);

    $('scrim').hidden = false;
    $('sheet').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    $('sheet').hidden = true;
    $('scrim').hidden = true;
    document.body.style.overflow = '';
    sheetItem = null;
  }

  // ---------- 데이터 ----------
  async function refresh() {
    var r = await loadSchedules();
    state.source = r.source;
    state.schedules = r.schedules;
    renderFilters();
    updateMeta();
    render();
    return r;
  }

  // ---------- 이동 ----------
  function shift(dir) {
    var c = state.cursor;
    if (state.view === 'month') state.cursor = new Date(c.getFullYear(), c.getMonth() + dir, 1);
    else if (state.view === 'week') state.cursor = addDays(c, 7 * dir);
    else state.cursor = addDays(c, dir);
    render();
  }

  $('btn-prev').addEventListener('click', function () { shift(-1); });
  $('btn-next').addEventListener('click', function () { shift(1); });
  $('btn-today').addEventListener('click', function () { state.cursor = new Date(); render(); });

  $('btn-reload').addEventListener('click', async function () {
    var b = $('btn-reload');
    b.classList.add('spin');
    var r = await refresh();
    b.classList.remove('spin');
    toast(r.source === 'github' ? '최신 일정을 불러왔습니다.'
      : r.source === 'cache' ? '오프라인 — 저장된 일정을 표시합니다.'
      : '불러오기 실패' + (r.error ? ' — ' + r.error : ''));
  });

  Array.prototype.forEach.call(document.querySelectorAll('.seg'), function (b) {
    b.addEventListener('click', function () { state.view = b.dataset.view; render(); });
  });

  $('cat-filter').addEventListener('change', function (e) {
    state.cat = e.target.value;
    renderFilters();        // 카테고리가 바뀌면 브랜드 목록도 다시 채움
    render();
  });

  $('brand-filter').addEventListener('change', function (e) {
    state.brand = e.target.value;
    renderFilters();
    render();
  });

  $('view').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) { e.stopPropagation(); openSheet(chip.dataset.id); return; }
    var ev = e.target.closest('.ev');
    if (ev) { openSheet(ev.dataset.id); return; }
    var cell = e.target.closest('.cell');
    if (cell) {
      state.cursor = parseLocal(cell.dataset.date);
      state.view = 'day';
      render();
    }
  });

  $('view').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var cell = e.target.closest('.cell');
    if (!cell) return;
    e.preventDefault();
    cell.click();
  });

  $('sheet-close').addEventListener('click', closeSheet);
  $('scrim').addEventListener('click', closeSheet);

  $('sheet-export').addEventListener('click', function () {
    if (!sheetItem) return;
    downloadIcs(sheetItem);
    toast('캘린더 파일을 내보냈습니다 · 시작 30분 전 알람 포함');
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!$('sheet').hidden) closeSheet();
      return;
    }
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowLeft') shift(-1);
    if (e.key === 'ArrowRight') shift(1);
    if (e.key === 't') { state.cursor = new Date(); render(); }
  });

  // 좌우 스와이프로 기간 이동
  var tx = 0, ty = 0, tracking = false;
  $('view').addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; tracking = true;
  }, { passive: true });
  $('view').addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.8) shift(dx < 0 ? 1 : -1);
  }, { passive: true });

  // 다시 열 때 최신 일정 반영
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') refresh();
  });

  // 라이트/다크 전환 시 칩 색을 그 모드용 단계로 다시 계산
  try {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { render(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  } catch (e) { /* matchMedia 미지원 */ }

  refresh();
})();
</script>
</body>
</html>
